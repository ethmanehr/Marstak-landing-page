
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قريباً... منصة جديدة في موريتانيا</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      text-align: center;
      direction: rtl;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }
    .logo-text {
      font-size: 48px;
      font-weight: bold;
      color: #27ae60;
      animation: float 2.5s infinite ease-in-out;
      margin-bottom: 30px;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    p {
      color: #34495e;
      line-height: 1.6;
    }
    input[type="email"] {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #219150;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
    }
    .footer a {
      color: #2980b9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">MARSTAK</div>
    <h1>قريباً... مشروع رقمي يغيّر طريقة البيع والشراء في موريتانيا</h1>
    <p>
      نعمل حالياً على تطوير منصة إلكترونية مبتكرة ستوفّر حلولاً جديدة لدعم المشاريع المحلية
      وتسهيل التجارة في السوق الموريتاني.
    </p>
    <p>
      إذا كنت مهتماً وتحب توصلك آخر التحديثات:
    </p>
    <input type="email" placeholder="بريدك الإلكتروني">
    <br>
    <button>تابع جديدنا</button>

    <div class="footer">
      <p>تابعنا على فيسبوك: <a href="https://facebook.com/marstak" target="_blank">مرستك</a></p>
    </div>
  </div>
</body>
</html>
